[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printquota"
version = "0.1.1"
description = "Self-hosted CUPS print quota, policy and accounting system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ceejay" }]
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "click>=8.1",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "bcrypt>=4.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ldap = ["ldap3>=2.9"]

[project.scripts]
quotactl = "printquota.cli.quotactl:cli"
printquota-accounting = "printquota.accounting.daemon:main"
printquota-reset = "printquota.cli.reset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
printquota = ["api/templates/*.html", "api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
